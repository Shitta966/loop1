<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="wrapper">
        <div class="card">
            <img src="./image/device.svg" alt="">
            <h3>MOBILE</h3>
            <p>Get notification about new releasesin our mobile app.</p>
            <p class="amount">
                <sup>$</sup>
                <span>10</span>
                <sub>month</sub>
            </p>
        </div>       
        <div class="card">
            <img src="./image/laptop.svg" alt="">
            <h3>DESKTOP</h3>
            <p>Enjoy new episode on your laptop in browser with our web service, which supports all the platforms.</p>
            <p class="amount">
                <sup>$</sup>
                <span>15</span>
                <sub>month</sub>
            </p>
        </div>      
         <div class="card">
            <img src="./image/monitor.svg" alt="">
            <h3>TV</h3>
            <p>Watch your favourite series at home on large screen with our tv application.</p>
            <p class="amount">
                <sup>$</sup>
                <span>20</span>
                <sub>month</sub>
            </p>
        </div>
  </div>  
</body>
</html>
